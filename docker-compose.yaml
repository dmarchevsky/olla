version: '3.8'

services:
  olla:
    image: ghcr.io/thushan/olla:latest
    # Optional local/source build: `docker compose build` or `up --build`
    # builds this instead of pulling the published image (e.g. for tools like
    # Dockhand that build straight from a git checkout). Plain `docker compose
    # up` still uses the pulled `image:` above if already present, so this is
    # additive and doesn't change default behaviour. See Dockerfile.source's
    # header comment for why this isn't the same Dockerfile as the release image.
    build:
      context: .
      dockerfile: Dockerfile.source
    container_name: olla
    ports:
      - "${PORT}:${PORT}"
    volumes:
      # Mount your local config (comment out if using default)
      - ${HOST_CONFIG}:/config/config.yaml:ro
    environment:
      - OLLA_CONFIG_FILE=/config/config.yaml
      - OLLA_LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/internal/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ollama-network

# Example: Run Ollama alongside Olla
#  ollama:
#    image: ollama/ollama:latest
#    container_name: ollama
#    ports:
#      - "11434:11434"
#    volumes:
#      - ollama_data:/root/.ollama
#    restart: unless-stopped
#    networks:
#      - ollama-network

networks:
  ollama-network:
    driver: bridge

volumes:
  ollama_data: